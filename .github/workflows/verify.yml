name: Verification Pipeline

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  verify:
    name: Application Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Start Development Server
        # Run dev server in the background so the pipeline can continue to the verify script
        run: npm run dev &
        env:
          # Supabase keys must be configured in GitHub Repository Secrets
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Wait for Server Readiness
        # wait-on ensures the local server is accepting connections before tests run
        run: npx wait-on http://localhost:3000

      - name: Execute Verification Pipeline
        # This executes tsx scripts/verify.ts which runs our checks.
        # If it returns exit code 1, GitHub Actions automatically fails the pipeline.
        run: npm run verify
